<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pack</title>

<style>

*{
    margin: 20px;
    padding: 0;
}
   
body{
    background-color: rgb(27, 27, 139);
    font-family: 'Times New Roman', Times, serif;
}
    
.cards{
    width:min(92%,430px);
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.card{
    padding:22px;
    border-radius:22px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 25px rgba(0,0,0,.30);
    color:white;
}

.card h2{
    font-size:24px;
    margin-bottom:12px;
    font-weight:700;
}

.card p{
    font-size:16px;
    color:#ddd;
    line-height:1.6;
    margin-bottom:20px;
}

.card button{
    width:100%;
    height:52px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#2ecc71,#27ae60);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.card button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.card button:active{
    transform:scale(.98);
}
</style>

</head>
<body>



<main>

<div class="cards">

    <div class="card">
        <h2>Pack Colombia</h2>

        <p>
         Lleva la pasión del FPC a otro nivel con una experiencia llena de identidad, 
         estilo y sorpresas para los verdaderos hinchas.
        </p>

        <button onclick="window.location.href='licencia.html'">Desbloquear</button>
    </div>

</div>

</main>


</body>
</html>
